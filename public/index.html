<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10241f" />
    <title>Juniper Health — Care Operations Platform</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23123c31'/%3E%3Ctext x='50' y='71' font-size='62' text-anchor='middle' fill='%23b7e0cf' font-family='Georgia,serif'%3EJ%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/ui/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark">J</div>
          <div><strong>Juniper Health</strong><span>Care operations</span></div>
        </div>
        <nav class="primary-nav" aria-label="Primary navigation">
          <a class="nav-item active" href="#/dashboard" data-route="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></a>
          <p class="nav-label">Care delivery</p>
          <a class="nav-item" href="#/patients" data-route="patients"><span class="nav-icon">P</span><span>Patients</span></a>
          <a class="nav-item" href="#/visits" data-route="visits"><span class="nav-icon">V</span><span>Visits</span><span class="nav-count" id="visit-nav-count">–</span></a>
          <a class="nav-item" href="#/documentation" data-route="documentation"><span class="nav-icon">D</span><span>Documentation</span></a>
          <p class="nav-label">Financial</p>
          <a class="nav-item" href="#/revenue" data-route="revenue"><span class="nav-icon">R</span><span>Revenue cycle</span><span class="nav-dot" id="revenue-nav-dot"></span></a>
          <a class="nav-item" href="#/accounting" data-route="accounting"><span class="nav-icon">$</span><span>Accounting</span></a>
          <a class="nav-item" href="#/reports" data-route="reports"><span class="nav-icon">▥</span><span>Reports</span></a>
          <p class="nav-label">Platform</p>
          <a class="nav-item" href="#/workflows" data-route="workflows"><span class="nav-icon">↯</span><span>Workflows</span></a>
          <a class="nav-item ai-nav" href="#/ai" data-route="ai"><span class="nav-icon">✦</span><span>AI employee</span><span class="beta">BETA</span></a>
          <a class="nav-item" href="#/permissions" data-route="permissions"><span class="nav-icon">A</span><span>Permissions</span><span class="ent-tag" id="permissions-ent-tag" hidden>ENT</span></a>
        </nav>
        <div class="sidebar-footer">
          <div class="health-indicator"><span></span>All systems operational</div>
          <button class="profile-chip" type="button">
            <span class="avatar" id="profile-avatar">AA</span>
            <span><strong id="profile-name">Avery Admin</strong><small id="profile-role">Administrator</small></span>
            <span>•••</span>
          </button>
        </div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
          <div class="org-switcher">
            <span class="org-logo" id="org-logo">N</span>
            <label class="org-select-wrap">
              <small>Organization</small>
              <select id="org-select" class="org-select" aria-label="Switch organization">
                <option>Loading…</option>
              </select>
            </label>
          </div>
          <div class="topbar-actions">
            <div class="global-search-wrap">
              <label class="global-search">
                <span aria-hidden="true">⌕</span>
                <input id="global-search" placeholder="Search patients, MRN, member ID…" aria-label="Search patients" autocomplete="off" />
                <kbd>⌘ K</kbd>
              </label>
              <div class="search-results" id="search-results" hidden></div>
            </div>
            <button class="icon-button" aria-label="Help" title="Help">?</button>
            <button class="icon-button notification-button" aria-label="Notifications" title="Notifications">◌<span></span></button>
            <button class="primary-action" id="quick-action" type="button">+ New patient</button>
          </div>
        </header>
        <main id="app" tabindex="-1">
          <div class="loading-page">
            <div class="loading-line wide"></div>
            <div class="loading-line"></div>
            <div class="loading-grid"><div></div><div></div><div></div><div></div></div>
          </div>
        </main>
      </section>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="detail-drawer" id="detail-drawer" aria-label="Details" aria-hidden="true">
      <button class="drawer-close" id="drawer-close" aria-label="Close details">×</button>
      <div id="drawer-content"></div>
    </aside>

    <div class="modal-backdrop" id="modal-backdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="drawer-close" id="modal-close" aria-label="Close">×</button>
        <div id="modal-content"></div>
      </section>
    </div>

    <div class="toast-region" id="toasts" aria-live="polite"></div>
    <script src="/ui/app.js" defer></script>
  </body>
</html>
